name: 构建 · 校验 · 部署

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 构建（纯标准库，约 0.1 秒）
        run: cd src && python3 build.py

      - name: 静态校验（不过则中止，坏版本上不了线）
        run: python3 verify.py

      - name: 报告产物是否与仓库内版本有差异
        run: |
          if git diff --quiet -- site/index.html; then
            echo "仓库内产物已是最新，无需回写"
          else
            echo "检测到差异，部署后将回写仓库："
            git diff --stat -- site/index.html
          fi

      # 兼容两种命名：通用名 与 带日期后缀的组织命名习惯
      - name: 检查凭据来源
        if: github.event_name != 'pull_request'
        env:
          A: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          B: ${{ secrets.NETLIFY_AUTH_TOKEN_20260918 }}
        run: |
          if   [ -n "$A" ]; then echo "::notice::已读取 Secret: NETLIFY_AUTH_TOKEN"
          elif [ -n "$B" ]; then echo "::notice::已读取 Secret: NETLIFY_AUTH_TOKEN_20260918"
          else echo "::error::两个候选 Secret 均为空：NETLIFY_AUTH_TOKEN / NETLIFY_AUTH_TOKEN_20260918。请检查名称拼写、是否建在 Actions 的 Secrets 下、以及 Repository access 是否覆盖本仓库（public 仓库需选 Public repositories）"; exit 1
          fi

      - name: 部署到 Netlify
        if: github.event_name != 'pull_request'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_AUTH_TOKEN_20260918 }}
        run: |
          npx -y netlify-cli@latest deploy --dir=site --prod \
            --message "${{ github.ref_name }} @ ${{ github.sha }}"

      # 部署成功后才回写，保证「仓库里那份 == 线上那份」
      - name: 回写构建产物到仓库
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- site/index.html; then
            echo "无变化，跳过"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html
          git commit -m "chore(build): 同步构建产物 v$(cat VERSION) [skip ci]"
          git pull --rebase --autostash
          git push
          echo "产物已回写，仓库与线上一致"

      # 仅 main 分支打包给 Pages。github-pages 环境默认只允许受保护分支部署，
      # tag 触发时会被环境保护规则拒绝，故 tag 路径完全跳过 Pages。
      - name: 打包产物供 GitHub Pages 使用
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 打 tag 时归档成品到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" site/index.html \
            --title "${{ github.ref_name }}" \
            --notes "构建产物见附件 index.html（单文件、零外部依赖、可离线打开）。变更见 CHANGELOG.md。"

  # 第二个发布目标：GitHub Pages（无保留期限制，不消耗 Netlify credits）
  pages:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
